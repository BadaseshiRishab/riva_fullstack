
services:
  mongo:
    networks:
      - mern-network
    image: mongo:7
    container_name: mern-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ShoppingWebsite

  backend:
    container_name: mern-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/ShoppingWebsite
      JWT_SECRET: supersecret
      RAZORPAY_KEY_ID: rzp_test_TcELDMLvW7TETO
      RAZORPAY_KEY_SECRET: JBEkp1E77U1dx5Kdwf8093Is
    depends_on:
      - mongo
    networks:
      - mern-network
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    container_name: mern-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://${PUBLIC_IP_HOST_MACHINE}:5000/api
      DISABLE_ESLINT_PLUGIN: "true"
    depends_on:
      - backend
    networks:
      - mern-network
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    stdin_open: true
    tty: true

volumes:
  mongo_data:

networks:
  mern-network:
    driver: bridge
